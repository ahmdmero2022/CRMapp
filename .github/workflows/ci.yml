name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      # No tests exist yet (see CLAUDE.md); `dart test` exits non-zero with
      # no test/ directory, so it's omitted until a test suite is added.

  frontend:
    name: Frontend (Flutter web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release --web-renderer html
